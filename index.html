<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zehra'yı Ne Kadar Seviyorum</title>
    <link rel="stylesheet" href="zehra.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Zehra'yı ne kadar seviyorum</h1>
    </header>

    <main>
      <section
        class="slider slider--full"
        aria-label="Dünya'dan evrenlere kayan yolculuk"
      >
        <div class="slider__viewport">
          <div class="slider__track" id="sliderTrack">
            <article class="slide" data-scene="earth">
              <div class="slide__media">
                <img
                  src="images/earth.jpg"
                  alt="Dünya'nın uzaydan görünüşü"
                  loading="lazy"
                />
              </div>
              <div class="slide__copy">
                <h2>Dünya</h2>
                <div class="slide__mantra">Bundan da fazla.</div>
              </div>
            </article>

            <article class="slide" data-scene="solar">
              <div class="slide__media">
                <img
                  src="images/solar.jpg"
                  alt="Güneş Sistemi resmi"
                  loading="lazy"
                />
              </div>
              <div class="slide__copy">
                <h2>Güneş Sistemi</h2>
                <div class="slide__mantra">Bundan da fazla.</div>
              </div>
            </article>

            <article class="slide" data-scene="galaxies">
              <div class="slide__media">
                <img
                  src="images/galaxies.jpg"
                  alt="Galaksilerle dolu fotoğraf"
                  loading="lazy"
                />
              </div>
              <div class="slide__copy">
                <h2>Galaksiler</h2>
                <div class="slide__mantra">Bundan da fazla.</div>
              </div>
            </article>
          </div>
        </div>
        <button class="slider__button" id="sliderButton" type="button">
          sağa kaydır
        </button>
      </section>

      <section class="love-wall" aria-label="Bizim fotoğrafımız">
        <div class="love-wall__decor" aria-hidden="true">
          <span>❤️</span>
          <span>🌸</span>
          <span>🐞</span>
          <span>🐱</span>
          <span>🌼</span>
          <span>💜</span>
        </div>
        <figure class="love-wall__photo">
          <img
            src="images/zehra-ve-ben.jpg"
            alt="İkimizin birlikte çekildiği fotoğraf"
          />
          <figcaption>evrenin en tatlı balı: Zehra</figcaption>
        </figure>
      </section>

      <section class="final-note" aria-label="Sevgi mesajı">
        <p>Seni çok seviyorum balım.</p>
      </section>
    </main>

    <script>
      const track = document.getElementById("sliderTrack");
      const slides = document.querySelectorAll(".slide");
      const triggerBtn = document.getElementById("sliderButton");
      let currentIndex = 0;

      triggerBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % slides.length;
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
      });
    </script>
  </body>
</html>
